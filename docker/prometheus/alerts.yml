groups:
  - name: beauty_advisor
    rules:
      - alert: ApiDown
        expr: beauty_api_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L'API Beauty Advisor ne répond plus"

      - alert: ApiErrorRateHigh
        expr: increase(beauty_api_errors_total[5m]) / clamp_min(increase(beauty_api_requests_total[5m]), 1) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 20 % de réponses en erreur sur 5 minutes"

      - alert: ApiLatencyHigh
        expr: beauty_api_average_latency_ms > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence moyenne de l'API supérieure à 500 ms"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL est injoignable"

      - alert: ModelMonitoringAlert
        expr: beauty_model_monitoring_decision == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Le suivi du modèle demande une recalibration (décision alert)"

  - name: beauty_pipeline
    rules:
      - alert: PipelineStale
        expr: pipeline_freshness_seconds_since_last_run > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Aucun run du pipeline terminé depuis plus de 10 minutes"

      - alert: PipelineLastRunFailed
        expr: pipeline_last_run_ok == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Le dernier run du pipeline est en échec (contrôle qualité ou erreur technique)"

      - alert: PipelineRejectionRateHigh
        expr: pipeline_last_run_rejected / clamp_min(pipeline_last_run_consumed, 1) > 0.3
        for: 4m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 30 % d'événements rejetés sur le dernier run"

      - alert: PipelineConsumerLagHigh
        expr: pipeline_last_run_lag > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Le consommateur accumule du retard sur le flux (plus de 5000 messages)"
