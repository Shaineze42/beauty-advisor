groups:
  - name: beauty_advisor
    rules:
      - alert: ApiDown
        expr: beauty_api_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L'API Beauty Advisor ne répond plus"

      - alert: ApiErrorRateHigh
        expr: increase(beauty_api_errors_total[5m]) / clamp_min(increase(beauty_api_requests_total[5m]), 1) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 20 % de réponses en erreur sur 5 minutes"

      - alert: ApiLatencyHigh
        expr: beauty_api_average_latency_ms > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence moyenne de l'API supérieure à 500 ms"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL est injoignable"

      - alert: ModelMonitoringAlert
        expr: beauty_model_monitoring_decision == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Le suivi du modèle demande une recalibration (décision alert)"

  - name: beauty_pipeline
    rules:
      - alert: PipelineStale
        expr: pipeline_freshness_seconds_since_last_run > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Aucun run du pipeline terminé depuis plus de 10 minutes"

      - alert: PipelineLastRunFailed
        expr: pipeline_last_run_ok == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Le dernier run du pipeline est en échec (contrôle qualité ou erreur technique)"

      - alert: PipelineRejectionRateHigh
        expr: pipeline_last_run_rejected / clamp_min(pipeline_last_run_consumed, 1) > 0.3
        for: 4m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 30 % d'événements rejetés sur le dernier run"

      - alert: PipelineConsumerLagHigh
        expr: pipeline_last_run_lag > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Le consommateur accumule du retard sur le flux (plus de 5000 messages)"

  - name: beauty_serving
    rules:
      - alert: ServingApiDown
        # Ne se déclenche que si l'API tournait dans la dernière heure puis s'est arrêtée.
        expr: up{job="beauty_serving"} == 0 and on() (max_over_time(up{job="beauty_serving"}[1h]) == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L'API de serving ne répond plus"

      - alert: ServingServerErrorsHigh
        expr: sum(increase(ba_requests_total{code=~"5.."}[5m])) / clamp_min(sum(increase(ba_requests_total[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 5 % d'erreurs serveur (5xx) sur l'API de serving"

      - alert: ServingLatencyHigh
        expr: increase(ba_request_duration_seconds_sum[5m]) / clamp_min(increase(ba_request_duration_seconds_count[5m]), 1) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Durée moyenne des requêtes de l'API de serving supérieure à 500 ms"

      - alert: ServingModelAucLow
        expr: ba_model_content_auc_test < 0.6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "L'AUC de contenu du modèle servi est passée sous 0,60"

      - alert: ServingDataDrift
        expr: ba_drift_status == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Dérive des données détectée (PSI) : un réentraînement est à envisager"
