# Beauty Advisor : pile complète (données, application, monitoring)
# À lancer depuis la racine du dépôt avec ./scripts/up.sh
# (ou : docker compose --env-file .env -f docker/docker-compose.yml up -d --build)
name: beauty-advisor

services:
  # ---------- Couche données ----------
  postgres:
    image: postgres:15
    container_name: beauty_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./postgres/02_star_schema.sql:/docker-entrypoint-initdb.d/02_star_schema.sql:ro
    networks:
      - beauty_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: beauty_mongodb
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - beauty_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  # ---------- Couche application ----------
  app:
    build:
      context: ../app
    container_name: beauty_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - beauty_network
    command: ["sh", "-c", "sleep infinity"]
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports

  api:
    build:
      context: ../app
    container_name: beauty_api
    restart: unless-stopped
    command: ["python", "api.py"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../data:/app/data:ro
      - ../reports:/app/reports:ro
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - beauty_network

  # ---------- Monitoring et observabilité ----------
  exporter:
    build:
      context: ./exporter
    container_name: beauty_exporter
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      REPORTS_DIR: /reports
    volumes:
      - ../reports:/reports:ro
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - beauty_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: beauty_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beauty_network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: beauty_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - exporter
      - postgres-exporter
    networks:
      - beauty_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: beauty_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - beauty_network

  # ---------- Outils d'administration ----------
  pgadmin:
    image: dpage/pgadmin4
    container_name: beauty_pgadmin
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beauty_network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: beauty_mongo_express
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - beauty_network

  portainer:
    image: portainer/portainer-ce
    container_name: beauty_portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - beauty_network

volumes:
  postgres_data:
  mongo_data:
  pgadmin_data:
  portainer_data:
  prometheus_data:
  grafana_data:

networks:
  beauty_network:
    driver: bridge
